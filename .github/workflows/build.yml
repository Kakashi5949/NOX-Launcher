name: Build NØX Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NOXLauncher/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64 app
        run: dotnet publish ./NOXLauncher/NOXLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Launcher-Windows-x64
          path: ./NOXLauncher/bin/Release/net8.0-windows/win-x64/publish/
