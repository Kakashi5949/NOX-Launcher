name: Build NØX Client mod
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOXClient/**"
      - ".github/workflows/build-nox-client.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        working-directory: NOXClient
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-Client-Fabric-1.21.11
          path: NOXClient/build/libs/*.jar
